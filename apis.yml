aid: quip
name: Quip
description: >-
  Quip is a Salesforce-owned collaborative productivity platform that combines
  documents, spreadsheets, chat, and tasks into a single workspace tightly
  integrated with the Salesforce CRM. It enables teams to embed live data,
  collaborate in real time, and automate workflows across deal collaboration,
  account planning, and sales operations. The Quip Automation API is a REST
  interface for creating and managing threads, documents, messages, folders,
  and users with OAuth 2.0 Bearer token authentication.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Collaboration
  - Productivity
  - Documents
  - Spreadsheets
  - Team Chat
  - Salesforce
url: >-
  https://raw.githubusercontent.com/api-evangelist/quip/refs/heads/main/apis.yml
created: '2026-05-11'
modified: '2026-05-11'
specificationVersion: '0.19'
apis:
  - aid: quip:automation-api
    name: Quip Automation API
    description: >-
      REST API for programmatically managing Quip threads, documents,
      spreadsheets, messages, folders, and users. Supports OAuth 2.0 access
      tokens passed as a Bearer token in the Authorization header.
    humanURL: https://quip.com/dev/automation/documentation
    baseURL: https://platform.quip.com/1
    tags:
      - Automation
      - Documents
      - Threads
      - Messages
      - Folders
      - Users
    properties:
      - type: Documentation
        url: https://quip.com/dev/automation/documentation
      - type: APIReference
        url: https://quip.com/api/reference
      - type: Authentication
        url: https://quip.com/dev/automation/documentation/current#tag/Auth
  - aid: quip:admin-api
    name: Quip Admin API
    description: >-
      Administrative REST API for managing organization-level Quip resources
      including company configuration, audit events, and user provisioning.
    humanURL: https://quip.com/dev/admin/documentation/current
    baseURL: https://platform.quip.com/1
    tags:
      - Admin
      - Provisioning
      - Audit
    properties:
      - type: Documentation
        url: https://quip.com/dev/admin/documentation/current
  - aid: quip:scim-api
    name: Quip SCIM API
    description: >-
      SCIM 2.0 API for automated user provisioning, deprovisioning, and group
      management from identity providers into Quip.
    humanURL: https://quip.com/dev/scim/documentation
    baseURL: https://platform.quip.com/1
    tags:
      - SCIM
      - Identity
      - Provisioning
    properties:
      - type: Documentation
        url: https://quip.com/dev/scim/documentation

